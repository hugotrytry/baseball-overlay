<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>棒球直播 Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; 
            color: white; 
            overflow: hidden;
        }
        
        /* 右下角 - 比分、局數、BSO、壘包 */
        .right-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .scoreboard-top {
            background: linear-gradient(to bottom, #e0b0ff, #b080d0);
            padding: 4px 12px;
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: center;
            gap: 20px;
            color: #000;
            font-weight: bold;
        }
        
        .scoreboard-bottom {
            background: #202080;
            padding: 4px 12px;
            border-radius: 0 0 4px 4px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .team-name {
            font-size: 14px;
        }
        
        .score-display {
            font-size: 24px;
            font-weight: bold;
        }
        
        .inning-small {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .base-diamond-small { 
            position: relative; 
            width: 50px; 
            height: 50px; 
        }
        .base-small { 
            position: absolute; 
            width: 12px; 
            height: 12px; 
            border: 2px solid white; 
            transform: rotate(45deg);
            background: #333;
            transition: all 0.2s;
        }
        .base-small.active { 
            background: #ffaa00; 
            border-color: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
        }
        .base-small.b1 { right: 0; top: 19px; }
        .base-small.b2 { left: 19px; top: 0; }
        .base-small.b3 { left: 0; top: 19px; }
        
        .bso-small {
            display: flex;
            gap: 8px;
        }
        
        .lamp-group {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        
        .lamp-small { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: #333;
            border: 1px solid #555;
        }
        .lamp-small.b.active { background: #00ff00; border-color: #00ff00; }
        .lamp-small.s.active { background: #ffff00; border-color: #ffff00; }
        .lamp-small.o.active { background: #ff0000; border-color: #ff0000; }
        
        /* 左下角 - 打者資訊 */
        .left-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 300px;
        }
        
        .batter-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .batter-stats {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #ccc;
            flex-wrap: wrap;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 2px;
        }
        
        .at-bat-history {
            margin-top: 8px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .at-bat-tag {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 右下角 - 比分、局數、BSO、壘包 -->
    <div class="right-panel">
        <div class="scoreboard-top">
            <span class="team-name" id="opponent-name">對手</span>
            <span class="score-display" id="opp-score">0</span>
            <span style="font-size: 18px;">-</span>
            <span class="score-display" id="our-score">0</span>
            <span class="team-name">我方</span>
        </div>
        <div class="scoreboard-bottom">
            <div class="inning-small">
                <span id="inning-dir">▲</span>
                <span id="inning-num" style="font-size: 18px; font-weight: bold;">1</span>
            </div>
            <div class="bso-small">
                <div class="lamp-group">
                    <span style="font-size: 12px;">B</span>
                    <div id="b1" class="lamp-small b"></div>
                    <div id="b2" class="lamp-small b"></div>
                    <div id="b3" class="lamp-small b"></div>
                </div>
                <div class="lamp-group">
                    <span style="font-size: 12px;">S</span>
                    <div id="s1" class="lamp-small s"></div>
                    <div id="s2" class="lamp-small s"></div>
                </div>
                <div class="lamp-group">
                    <span style="font-size: 12px;">O</span>
                    <div id="o1" class="lamp-small o"></div>
                    <div id="o2" class="lamp-small o"></div>
                </div>
            </div>
            <div class="base-diamond-small">
                <div id="base1" class="base-small b1"></div>
                <div id="base2" class="base-small b2"></div>
                <div id="base3" class="base-small b3"></div>
            </div>
        </div>
    </div>

    <!-- 左下角 - 打者資訊 -->
    <div class="left-panel">
        <div id="curr-batter" class="batter-name">等待比賽開始...</div>
        <div id="curr-stats" class="batter-stats"></div>
        <div id="at-bat-history" class="at-bat-history"></div>
    </div>

    <script>
        // 你的 Supabase 資訊
        const SUPABASE_URL = "https://jftoaptbakzwcvuionmk.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdG9hcHRiYWt6d2N2dWlvbm1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDkwODYsImV4cCI6MjA5MzUyNTA4Nn0.lt-dvJTg_9aUy61rpHMI5kKf5T9MbqMNiXfKaOhNgoE";
        
        let client;

        try {
            client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Supabase 初始化失敗", e);
        }

        function getResultColor(result) {
            const hits = ['一安', '二安', '三安', '全壘', '內安'];
            const outs = ['滾', '飛', '內飛', '雙殺', '三振', '犧失敗', '盜失敗'];
            if (hits.includes(result)) return '#ff6b6b';
            if (outs.includes(result)) return '#4ecdc4';
            return '#95a5a6';
        }

        async function refresh() {
            if (!client) return;
            
            try {
                // 取得遊戲狀態
                const { data: states } = await client
                    .from('live_game_state')
                    .select('*')
                    .order('updated_at', { ascending: false })
                    .limit(1);
                    
                const state = states && states.length > 0 ? states[0] : null;
                
                if (state) {
                    document.getElementById('our-score').innerText = state.our_score || 0;
                    document.getElementById('opp-score').innerText = state.opponent_score || 0;
                    document.getElementById('opponent-name').innerText = state.opponent_name || '';
                    document.getElementById('inning-num').innerText = state.inning || 1;
                    document.getElementById('inning-dir').innerText = state.is_top_inning ? '▲' : '▼';
                    
                    // 更新 BSO
                    for(let i=1;i<=3;i++) {
                        document.getElementById('b'+i).classList.toggle('active', (state.balls || 0) >= i);
                    }
                    for(let i=1;i<=2;i++) {
                        document.getElementById('s'+i).classList.toggle('active', (state.strikes || 0) >= i);
                        document.getElementById('o'+i).classList.toggle('active', (state.outs || 0) >= i);
                    }
                    
                    // 更新壘包
                    document.getElementById('base1').classList.toggle('active', state.is_first_base_occupied || false);
                    document.getElementById('base2').classList.toggle('active', state.is_second_base_occupied || false);
                    document.getElementById('base3').classList.toggle('active', state.is_third_base_occupied || false);
                    
                    // 顯示打席歷史
                    if (state.current_batter_at_bat_history) {
                        const historyArray = state.current_batter_at_bat_history.split(',');
                        const historyHtml = historyArray.map(h => 
                            `<span class="at-bat-tag" style="background-color: ${getResultColor(h)}">${h}</span>`
                        ).join('');
                        document.getElementById('at-bat-history').innerHTML = historyHtml;
                    } else {
                        document.getElementById('at-bat-history').innerHTML = '';
                    }
                }

                // 取得打者快照
                const { data: batters } = await client
                    .from('live_batter_snapshot')
                    .select('*')
                    .order('updated_at', { ascending: false })
                    .limit(1);
                    
                const batter = batters && batters.length > 0 ? batters[0] : null;
                    
                if (batter) {
                    document.getElementById('curr-batter').innerText = (batter.batting_order || 0) + '棒 #' + (batter.number || 0) + ' ' + (batter.name || '');
                    document.getElementById('curr-stats').innerHTML = `
                        <div class="stat-item"><span class="stat-label">打席</span><span>${batter.pa || 0}</span></div>
                        <div class="stat-item"><span class="stat-label">打數</span><span>${batter.ab || 0}</span></div>
                        <div class="stat-item"><span class="stat-label">安打</span><span>${batter.h || 0}</span></div>
                        <div class="stat-item"><span class="stat-label">打擊率</span><span>${batter.avg || '0.000'}</span></div>
                        <div class="stat-item"><span class="stat-label">有效打擊</span><span>${batter.eh_rate || '0.000'}</span></div>
                        <div class="stat-item"><span class="stat-label">盜壘</span><span>${batter.sb || 0}</span></div>
                    `;
                }
            } catch (e) {
                console.error("更新失敗", e);
            }
        }

        // 初始載入
        if (client) {
            refresh();
            
            // 每 1 秒強制更新一次
            setInterval(refresh, 1000);
        }
    </script>
</body>
</html>
