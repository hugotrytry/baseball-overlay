<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>棒球直播 Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; 
            color: white; 
            overflow: hidden;
            display: inline-block;
            -webkit-font-smoothing: antialiased;
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
        }
        html {
            background: transparent;
        }
        
        .scoreboard {
            background: rgba(0, 0, 0, 0.88);
            border-radius: 11px;
            padding: 12px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 380px;           /* 固定寬度，減少縮放模糊 */
            min-width: 380px;
            max-width: 420px;
            transform: scale(1);
        }

        /* 目前打者列 */
        .current-batter-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
        }
        .batter-info { font-weight: bold; }
        .at-bat-history { display: flex; gap: 5px; flex-wrap: wrap; }
        .at-bat-tag {
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        /* 球隊比分 + 壘包+局數 */
        .teams-with-bases {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 12px;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
        }
        .team-away {
            background: linear-gradient(90deg, #e898d8, #d46bc4);
            color: #000;
        }
        .team-home {
            background: linear-gradient(90deg, #3050b0, #1e3a8a);
            color: #fff;
        }
        .team-name { font-size: 14px; min-width: 85px; }
        .score-num {
            font-size: 26px;
            font-weight: 900;
            min-width: 32px;
            text-align: left;
        }

        .base-and-inning {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 70px;
            flex-shrink: 0;
        }

        .base-diamond { 
            position: relative; 
            width: 64px; 
            height: 64px;
        }
        .base { 
            position: absolute; 
            width: 17px; 
            height: 17px; 
            border: 2px solid #777; 
            transform: rotate(45deg);
            background: #222;
            transition: all 0.3s;
        }
        .base.active { 
            background: #ffdd57; 
            border-color: #ffdd57;
            box-shadow: 0 0 12px #ffdd57;
        }
        .base.b1 { right: 2px; top: 23px; }
        .base.b2 { left: 23px; top: 2px;  }
        .base.b3 { left: 2px;  top: 23px; }

        .inning-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
        }

        .status-panel {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #111;
            border-radius: 6px;
            padding: 8px 14px;
        }
        .next-batter-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            padding-right: 14px;
            border-right: 1px solid #444;
        }
        .next-batter-panel .label { color: #999; font-weight: normal; }
        .bso-indicators { display: flex; gap: 14px; }
        .bso-group { display: flex; align-items: center; gap: 4px; }
        .bso-label { font-size: 13px; font-weight: bold; }
        .lamp {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #555;
        }
        .lamp.b.active { background: #22ff44; box-shadow: 0 0 6px #22ff44; }
        .lamp.s.active { background: #ffdd00; box-shadow: 0 0 6px #ffdd00; }
        .lamp.o.active { background: #ff4444; box-shadow: 0 0 6px #ff4444; }
    </style>
</head>
<body>
    <div class="scoreboard">
        <!-- 目前打者資訊 -->
        <div id="current-batter-bar" class="current-batter-bar" style="display: none;">
            <span id="curr-batter" class="batter-info"></span>
            <div id="at-bat-history" class="at-bat-history"></div>
        </div>

        <!-- 球隊比分 + 壘包/局數 -->
        <div class="teams-with-bases">
            <div class="teams">
                <div class="team-row team-away">
                    <span class="team-name" id="away-team-name">錦興國小</span>
                    <span class="score-num" id="away-score">1</span>
                </div>
                <div class="team-row team-home">
                    <span class="team-name" id="home-team-name">龍安國小</span>
                    <span class="score-num" id="home-score">4</span>
                </div>
            </div>

            <div class="base-and-inning">
                <div class="base-diamond">
                    <div id="base1" class="base b1"></div>
                    <div id="base2" class="base b2"></div>
                    <div id="base3" class="base b3"></div>
                </div>
                <div class="inning-display">
                    <span id="inning-dir">▲</span>
                    <span id="inning-num">1</span>
                </div>
            </div>
        </div>

        <!-- 狀態面板：BSO -->
        <div class="status-panel">
            <div id="next-batter" class="next-batter-panel" style="display: none;">
                <span class="label">Next</span>
                <span id="next-batter-info"></span>
            </div>
            <div class="bso-indicators">
                <div class="bso-group">
                    <span class="bso-label">B</span>
                    <span id="b1" class="lamp b"></span>
                    <span id="b2" class="lamp b"></span>
                    <span id="b3" class="lamp b"></span>
                </div>
                <div class="bso-group">
                    <span class="bso-label">S</span>
                    <span id="s1" class="lamp s"></span>
                    <span id="s2" class="lamp s"></span>
                </div>
                <div class="bso-group">
                    <span class="bso-label">O</span>
                    <span id="o1" class="lamp o"></span>
                    <span id="o2" class="lamp o"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jftoaptbakzwcvuionmk.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdG9hcHRiYWt6d2N2dWlvbm1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDkwODYsImV4cCI6MjA5MzUyNTA4Nn0.lt-dvJTg_9aUy61rpHMI5kKf5T9MbqMNiXfKaOhNgoE";
        
        let client;
        try {
            client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) { console.error("Supabase 初始化失敗", e); }

        function getResultColor(result) {
            const hits = ['一安', '二安', '三安', '全壘', '內安'];
            const outs = ['滾', '飛', '內飛', '雙殺', '三振', '犧失敗'];
            const free = ['四壘', '保送', '觸身'];
            const sacrifice = ['犧飛', '犧觸'];
            const other = ['選', '失誤上壘'];
            if (hits.includes(result)) return '#ff6b6b';
            if (outs.includes(result)) return '#4ecdc4';
            if (free.includes(result)) return '#feca57';
            if (sacrifice.includes(result)) return '#48dbfb';
            if (other.includes(result)) return '#ff9ff3';
            return '#95a5a6';
        }

        async function refresh() {
            if (!client) return;
            try {
                const { data: states } = await client
                    .from('live_game_state')
                    .select('*')
                    .order('updated_at', { ascending: false })
                    .limit(1);
                
                const state = states && states.length > 0 ? states[0] : null;
                if (state) {
                    document.getElementById('home-team-name').innerText = state.home_team_name || "龍安國小";
                    document.getElementById('home-score').innerText = state.our_score || 0;
                    document.getElementById('away-team-name').innerText = state.away_team_name || state.opponent_name || "對手";
                    document.getElementById('away-score').innerText = state.opponent_score || 0;

                    document.getElementById('inning-num').innerText = state.inning || 1;
                    document.getElementById('inning-dir').innerText = state.is_top_inning ? '▲' : '▼';

                    for(let i=1;i<=3;i++) document.getElementById('b'+i).classList.toggle('active', (state.balls || 0) >= i);
                    for(let i=1;i<=2;i++) {
                        document.getElementById('s'+i).classList.toggle('active', (state.strikes || 0) >= i);
                        document.getElementById('o'+i).classList.toggle('active', (state.outs || 0) >= i);
                    }

                    document.getElementById('base1').classList.toggle('active', state.is_first_base_occupied || false);
                    document.getElementById('base2').classList.toggle('active', state.is_second_base_occupied || false);
                    document.getElementById('base3').classList.toggle('active', state.is_third_base_occupied || false);

                    const batterBar = document.getElementById('current-batter-bar');
                    const historyContainer = document.getElementById('at-bat-history');
                    let lastHistory = historyContainer.dataset.lastHistory || '';

                    const isHomeTeam = state.is_home_team !== undefined ? state.is_home_team : true;
                    const isOurOffense = isHomeTeam ? !state.is_top_inning : state.is_top_inning;

                    if (state.current_batter_id && isOurOffense) {
                        let batterText = '';
                        if (state.current_batter_order) batterText = `${state.current_batter_order}棒`;
                        if (state.current_batter_number && state.current_batter_name) {
                            batterText += ` #${state.current_batter_number} ${state.current_batter_name}`;
                        } else if (state.current_batter_name) {
                            batterText += ` ${state.current_batter_name}`;
                        }
                        document.getElementById('curr-batter').innerText = batterText;

                        const currentHistory = state.current_batter_at_bat_history || '';
                        if (currentHistory !== lastHistory) {
                            historyContainer.innerHTML = '';
                            if (currentHistory) {
                                historyContainer.innerHTML = currentHistory.split(',').map(h =>
                                    `<span class="at-bat-tag" style="background-color:${getResultColor(h)}">${h}</span>`
                                ).join('');
                            }
                            historyContainer.dataset.lastHistory = currentHistory;
                        }
                        batterBar.style.display = 'flex';
                        
                        const nextBatterDiv = document.getElementById('next-batter');
                        const nextBatterInfo = document.getElementById('next-batter-info');
                        if (state.next_batter_name) {
                            let nextText = '';
                            if (state.next_batter_number) nextText += `#${state.next_batter_number} `;
                            nextText += state.next_batter_name;
                            nextBatterInfo.innerText = nextText;
                            nextBatterDiv.style.display = 'flex';
                        } else {
                            nextBatterDiv.style.display = 'none';
                        }
                    } else {
                        batterBar.style.display = 'none';
                        document.getElementById('next-batter').style.display = 'none';
                        if (lastHistory !== '') {
                            historyContainer.innerHTML = '';
                            historyContainer.dataset.lastHistory = '';
                        }
                    }
                }
            } catch (e) { console.error("更新失敗", e); }
        }

        if (client) {
            refresh();
            setInterval(refresh, 1000);
        }
    </script>
</body>
</html>
